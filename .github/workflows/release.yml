name: Continuous Delivery (Release)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quality Checks
        run: |
          pnpm lint
          pnpm test

      - name: Build Workspaces
        run: pnpm build

      # 1. Publish shared npm libraries in packages/ (Skipped for now)
      # - name: Publish NPM Packages
      #   run: pnpm -r --filter "./packages/*" publish --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 2. Package the VS Code extension
      - name: Package VS Code Extension
        run: pnpm package:extension

      # 3. Publish to VS Code Marketplace
      - name: Publish VS Code Extension
        run: pnpm --filter liquid-lsp-vscode-extension exec vsce publish -p $VSCE_PAT
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # 4. Create GitHub Release and upload the VSIX binary
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vscode-extension/dist/liquid-lsp.vsix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
